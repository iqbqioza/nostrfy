[package]
name = "nostrfy"
version = "0.1.24"
edition = "2024"
description = "A minimal and stable Nostr relay server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/iqbqioza/nostrfy"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tungstenite = { version = "0.29", default-features = false }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
env_logger = "0.11"
futures-util = "0.3"
getrandom = "0.2"
# `read-txn-no-tls` makes heed open LMDB environments with MDB_NOTLS: without
# it, every environment allocates a process-wide pthread TLS key when it is
# opened, the key is only released when the environment is closed, and the
# FreeBSD CI opens enough environments to exhaust the (small) pthread key
# table, making `mdb_env_open` fail with EAGAIN. MDB_NOTLS is safe here: every
# read transaction is created and dropped on the same database thread.
heed = { version = "0.20", features = ["read-txn-no-tls"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service", "http1", "http2"] }
libc = "0.2"
log = "0.4"
secp256k1 = { version = "0.30", features = ["std", "hashes"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# S3/R2 (Cloudflare R2 is S3-compatible) storage for the Blossom file server;
# rustls provides the TLS the S3 API requires.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tower = { version = "0.5", features = ["util"] }
toml = "0.8"
# `nostrfy upgrade`: fetches the latest release binary (and the latest
# version tag) over HTTPS with rustls; no other network use.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
anyhow = "1.0.104"

# Release build tuning: LTO is off on purpose. The hot paths live in C
# libraries (libsecp256k1 verifies signatures, LMDB stores events) and in
# generic Rust that monomorphizes into this crate, so the ingest and
# fan-out benchmarks are within run-to-run noise with LTO off — while fat
# LTO made every release rebuild take ~3 minutes because its final phase is
# single-threaded (raising codegen-units does not parallelize it). LTO off
# with parallel codegen units rebuilds in ~1 minute. `panic = "unwind"` is
# required: the database threads recover from panics with `catch_unwind`,
# which `panic = "abort"` would silently disable (a panic would then kill
# the whole relay).
[profile.release]
lto = "off"
codegen-units = 16
strip = "symbols"
panic = "unwind"

# The relay's own crate stays unoptimized in a debug build (for
# debuggability), but every dependency is compiled at opt-level 3: the hot
# path spends most of its time in secp256k1 (signature verification),
# serde_json (parsing) and heed/LMDB (storage), and unoptimized versions
# of those would dominate any debug-mode benchmark.
[profile.dev.package."*"]
opt-level = 3

# Debug-mode overflow checks cost real time in the hot loops (hashing,
# tokenizing, timestamps); the code is audited and uses saturating
# arithmetic where wraparound would matter, so they are disabled.
[profile.dev]
# Light optimization for the relay's own crate: a debug build keeps
# assertions, but opt-level 1 makes the hot loops (event validation,
# window processing) fast enough for load testing.
opt-level = 1
overflow-checks = false
# Line tables only: backtraces keep file and line numbers, while the
# local-variable debug info that dominates compile and link time is
# dropped. (The FreeBSD CI job drops debug info entirely because its link
# would otherwise run out of memory.)
debug = "line-tables-only"

# The FreeBSD CI job builds the whole dependency graph inside an emulated
# VM on every run (there is no cargo cache in there), and that cold build
# is over 6 of the job's 8 minutes. The suite itself only takes seconds on
# that machine, so the job trades dependency optimization for compile
# time: unoptimized dependencies build in a fraction of the time and the
# tests still exercise the same code. Debug info is off too (its link is
# what ran out of memory before).
[profile.dev-vm]
inherits = "dev"
debug = 0

[profile.dev-vm.package."*"]
opt-level = 1

[dev-dependencies]
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
