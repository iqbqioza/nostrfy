# nostrfy.toml — private (invite-only / authenticated) relay
#
# For a closed community: only authenticated clients (NIP-42) may
# publish, and `restrict_relay = true` narrows publishing to the allow
# list. Reading stays open to everyone (NIP-11 `restricted_writes`
# semantics), so the members' posts remain publicly readable — add
# `require_auth` if you want publishing restricted to authenticated
# clients as well.

[relay]
name = "nostrfy private"
description = "Private relay for a closed group of friends"
pubkey = ""
private_key = ""            # `nostrfy genkey`
public_url = "wss://private.example.com"
# Small audience: tighten the publish rate.
max_events_per_min_per_pubkey = 30
# Only authenticated clients (NIP-42 AUTH before EVENT) may publish.
require_auth = true
send_auth_challenge = true
# NIP-78 app-specific events: AUTH to publish, owner-only to serve (default).
enabled_nip78_auth = true
# Command events: kind:1 admin commands from relay.pubkey, replied with
# relay.private_key (default off). Set relay.pubkey to the admin pubkey.
enabled_command_events = false
# Keep it small: no search, no groups, no negentropy, no NIP-50.
enabled_nips = [1, 9, 11, 40, 42, 45, 46, 59, 65, 70, 78, 84]

[access]
# Only allow-listed pubkeys may POST (reading stays open to everyone;
# denied pubkeys are the only ones refused reads). The allow/deny lists
# are NOT config keys: they live in the relay database and are managed
# with `nostrfy relay allow <pubkey>` / `nostrfy relay deny <pubkey>`
# (the admin and the relay's own pubkey are always exempt).
restrict_relay = true
# Optional: only accept these kinds (empty = all kinds allowed).
allowed_kinds = [1, 4, 6, 7, 14, 42, 9735]
blocked_kinds = []

[limits]
# A private relay is small: tighten everything.
max_connections = 500
max_connections_per_ip = 8

[rpc]
# Management API (NIP-86) on its own port (must differ from
# server.port) with a strong token; 0 disables the API entirely.
management_port = 8081
management_token = "change-me-to-a-long-random-string"

[server]
host = "0.0.0.0"
port = 8080
metrics_enabled = false

[database]
path = "./data"
search_index = false
meta_index = true