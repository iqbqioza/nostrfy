# nostrfy.toml — DM-focused relay
#
# A relay for private direct messages (NIP-04 legacy kind 4, NIP-17
# kind 14, NIP-59 gift-wrapped kind 1059). Encrypted content is
# unreadable to the relay, so full-text search is pointless — the word
# index is disabled to keep storage small and writes fast. NIP-42
# authentication can be required to keep junk and spam out of the
# envelope store.

[relay]
name = "nostrfy dm"
description = "Private direct-message relay"
pubkey = ""
private_key = ""            # optional; only needed for NIP-29 metadata
public_url = "wss://dm.example.com"
# Only what a DM relay needs: NIP-01 (core), 04 (legacy DMs), 17 (DMs),
# 42 (auth), 59 (gift wraps), 70 (protected events), 11, 33, 40.
enabled_nips = [1, 4, 11, 17, 33, 40, 42, 59, 70]
# Strong privacy default: keep DMs out of NIP-50 search entirely.
disabled_nips = [50]
require_auth = false        # true = only authenticated clients may publish

[limits]
# Encrypted envelopes are bigger than plain notes: allow larger bodies
# and longer tag values (kind 14 DMs carry p tags and quoted event ids).
max_content_bytes = 131072
max_tag_value_bytes = 2048
max_ws_message_bytes = 2097152
# DM writers are steady, not bursty; keep the default rate limit.
max_events_per_min_per_pubkey = 60
# Long-polling DM clients keep connections open.
ws_idle_timeout_secs = 1800

[database]
path = "./data"
# No search index: smaller DB, faster ingest, and the encrypted content
# never gets indexed.
search_index = false
meta_index = true

[server]
host = "0.0.0.0"
port = 8080
metrics_enabled = false