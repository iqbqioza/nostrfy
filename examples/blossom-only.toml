# nostrfy.toml — Blossom-only media server
#
# Runs the Blossom file server (NIP-98 upload/download) on its own
# hostname while the relay keeps serving on the main host: requests with
# the `Host: media.example.com` header are routed to the Blossom routes
# only, so one process serves both the relay and the media server behind
# a reverse proxy (see docs/MANUAL.md, the Blossom section).
#
# Point your reverse proxy at the same port for both hostnames:
#   relay.example.com -> 8080   (Nostr relay + API)
#   media.example.com -> 8080   (Blossom only)
#
# The relay side keeps its defaults; media-specific knobs live in
# [blossom].

[relay]
name = "nostrfy media"
description = "Blossom file storage for nostr media"
pubkey = ""                 # your pubkey (shown in NIP-11)
private_key = ""            # run `nostrfy genkey` to generate one
public_url = "wss://relay.example.com"

[server]
host = "0.0.0.0"
port = 8080

[blossom]
# Requests for this hostname are served Blossom routes only; the relay
# and REST API keep working on every other Host header.
host = "media.example.com"

# --- local storage -----------------------------------------------------------
storage = "local"
local_path = "/var/lib/nostrfy/images"
# Maximum upload size: 20 MiB by default. Raise it for video/large files:
max_upload_bytes = 20971520
# Refuse uploads when the disk has less free space than this (avoids a
# full disk taking the LMDB writer down with it). 0 disables the check.
min_free_bytes = 33554432
# Only pubkeys listed via `nostrfy blossom allow <pubkey>` may upload.
restrict_uploads = false

# --- S3-compatible storage (Cloudflare R2, AWS S3, MinIO, ...) -------------
# To use S3 instead of local files, set:
#   storage = "s3"
#   s3_endpoint = "https://<account>.r2.cloudflarestorage.com"   # R2 example
#   s3_region = "auto"                                           # "auto" for R2
#   s3_bucket = "nostrfy-media"
#   s3_access_key = "..."
#   s3_secret_key = "..."

# --- relay-side limits that matter for a media-heavy relay ----------------
[limits]
# Media clients upload large files; keep the default or raise it:
max_ws_message_bytes = 1048576