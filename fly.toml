# fly.toml — template for deploying nostrfy to Fly.io.
#
# Quick start (see docs/DEPLOYMENT.md for the full guide):
#   1. fly launch --no-deploy --name <app-name>
#   2. fly volumes create data --size 1 --region <region>
#   3. set the relay name / public_url in deploy/nostrfy.container.toml
#   4. fly secrets set NOSTRFY_RELAY_PRIVATE_KEY=...   (never bake it)
#   5. fly deploy
#
# app = the app name (required, must be unique on Fly). Set it with
#       `fly launch --name <name>` or edit this line.
app = "nostrfy"
primary_region = "nrt"   # change to your preferred region

# Graceful shutdown drains WebSockets, flushes the final database batch and
# writes the group/role snapshots. The relay's budget is 27s, so Fly's
# default 5s would SIGKILL mid-drain.
kill_timeout = "35s"

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A relay must stay reachable at all times: never let Fly stop the
  # machine during idle periods.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Liveness only: /health returns 503 while the database refuses writes
  # (full disk/map) even though the relay still serves reads; using it here
  # would restart a healthy relay.
  [[http_service.checks]]
    path = "/live"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[metrics]
  # Scraped by Fly from the same listener that serves /metrics (8080):
  # a separate port (9091) is never bound by the container.
  port = 8080
  path = "/metrics"