# nostrd configuration for container deployments (Fly.io, App Platform, ECS,
# Cloud Run, Container Apps) — baked into the image at /etc/nostrd/nostrd.toml.
#
# Edit this file BEFORE building the image (or mount your own config at
# /etc/nostrd/nostrd.toml) to set:
#   - the relay name and description
#   - `public_url`  (required for NIP-42/62/98)
#   - `private_key` (required for NIP-29 groups)

[relay]
name = "nostrd on Fly.io"
description = "A nostrd relay running on Fly.io"
pubkey = ""
contact = ""
icon = ""
post_policy = ""
private_key = ""
public_url = "wss://YOUR-APP-NAME.fly.dev"
livekit_url = ""
livekit_api_key = ""
livekit_api_secret = ""
enabled_nips = []
disabled_nips = []

[server]
# Fly terminates TLS; the container itself serves plain WS on 0.0.0.0:8080.
host = "0.0.0.0"
port = 8080
api_host = ""
management_port = 0
management_host = "127.0.0.1"
management_token = ""
admin_pubkey = ""
require_auth = false
send_auth_challenge = true
# NIP-78 app-specific events: AUTH to publish, owner-only to serve (default).
enabled_nip78_auth = true
# Command events: kind:1 admin commands from relay.pubkey, replied with relay.private_key (default off).
enabled_command_events = false
metrics_enabled = true

[limits]
max_connections = 10000
max_connections_per_ip = 0
max_ws_message_size = 1048576
max_filters = 20
max_subscriptions = 20
max_limit = 500
count_limit = 2000
max_sub_id_len = 64
max_content_bytes = 65536
max_tags = 2000
max_tag_value_bytes = 1024
max_created_at_future = 3600
require_pow = 0
max_indexed_words = 128
buffer_size = 2048
neg_max_items = 100000
db_request_timeout_secs = 30
new_pubkey_min_age_secs = 0
max_out_queue_bytes = 262144
ws_idle_timeout_secs = 0
db_queue_msgs = 4096
db_queue_events = 262144
max_sub_bytes = 524288
group_late_publish_secs = 604800
api_max_concurrent = 32
api_max_limit = 500
api_max_offset = 10000
api_max_search_bytes = 1024
live_batch_interval_ms = 10
live_batch_size = 64
live_buffer = 65536

[database]
# LMDB data persists on the Fly volume mounted at /data.
path = "/data"
max_dbs = 32
max_readers = 128
map_size = 1073741824
map_max_size = 1099511627776
purge_interval_secs = 300
search_index = true

[daemon]
# Foreground mode: these are unused but must be non-empty paths.
pid_file = "/tmp/nostrd.pid"
log_file = "/tmp/nostrd.log"
stats_file = "/tmp/nostrd.stats.json"
stats_interval_secs = 5
log_max_size_bytes = 52428800
log_max_files = 5

# Blossom file server (media hosting) — enabled when `host` is set.
# Files are stored under /data/images ("bucket/{npub1}/{file}") or in an
# S3-compatible bucket (R2) when storage = "s3".
[blossom]
host = ""                          # e.g. "media.example.com" (empty = disabled)
storage = "local"                  # "local" or "s3"
local_path = "/data/images"
max_upload_bytes = 20971520        # 20 MiB
restrict_uploads = false            # only allowlisted pubkeys may upload
s3_endpoint = ""                   # e.g. "https://<account>.r2.cloudflarestorage.com"
s3_region = "auto"
s3_bucket = ""
s3_access_key = ""
s3_secret_key = ""

[access]
restrict_relay = false   # allow/deny lists are managed via 'nostrd relay allow/deny' (LMDB)
blocked_kinds = []
allowed_kinds = []
blocked_ips = []