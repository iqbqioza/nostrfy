name: Nightly

# The soak/chaos verification SIGKILLs the relay mid-write, runs for
# several minutes and depends on release-build timing, so it is kept out
# of the pull-request CI (ci.yml) and only runs here.
on:
  schedule:
    # Daily at 03:17 UTC: a few minutes off the hour keeps the job out of
    # GitHub's busiest scheduler slot.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  soak-chaos:
    name: Soak and chaos verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Soak and chaos
        run: bash scripts/soak_chaos.sh
        env:
          # 300 s of soak plus 3 kill/restart cycles; the release build is
          # cached by rust-cache, the 60-minute timeout leaves headroom.
          SOAK_SECONDS: "300"
          CHAOS_CYCLES: "3"

      - name: Upload relay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-chaos-relay-log
          path: target/soak-artifacts/
          if-no-files-found: warn
          retention-days: 14
