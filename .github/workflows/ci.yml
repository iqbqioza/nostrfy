name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (all targets, warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --all-targets

  freebsd:
    name: Build and test on FreeBSD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Pin a stable release: the action's default tracks FreeBSD
          # -CURRENT, which breaks CI with unrelated upstream churn. The
          # 14.x builder image predates the current pkg repository index
          # (the pkg OS-version check fails), so use the newest stable.
          release: "15.1"
          # IGNORE_OSVERSION: the builder image may lag the current pkg
          # repository index by a patch level (FreeBSD:14:amd64 mismatch);
          # binary compatibility makes ignoring the check safe.
          prepare: |
            env IGNORE_OSVERSION=yes pkg update -f
            env IGNORE_OSVERSION=yes pkg install -y rust
          run: |
            # The VM runs a cold, debuginfo-heavy `cargo test` build and
            # the final link of the nostrfy test binary exceeded the VM
            # memory, OOM-killing the compiler. Debug info is not needed
            # to run the tests, so drop it (debug assertions are an
            # independent setting and stay on).
            # Run the tests one at a time: every test opens its own LMDB
            # environment (a lock file with fcntl locks and process-shared
            # mutexes). Under parallel execution the FreeBSD VM hit a
            # per-process lock/keys resource limit and `mdb_env_open`
            # returned EAGAIN ("environment locked by another process"),
            # failing a couple of unrelated tests near the end of the
            # suite. Serial execution keeps the footprint flat.
            ulimit -a || true
            sysctl kern.maxposixlocksperuid kern.maxfiles kern.maxproc vm.max_proc_mmap 2>/dev/null || true
            CARGO_PROFILE_DEV_DEBUG=0 RUST_TEST_THREADS=1 cargo test --all-targets

  build:
    # Plain "Build": this is the CI compile check, not the tag-triggered
    # release workflow (release.yml), so "Release build" was misleading.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test
        run: |
          ./target/release/nostrfy --version
          ./target/release/nostrfy --config /tmp/nostrfy-test.toml init
          ./target/release/nostrfy --config /tmp/nostrfy-test.toml check