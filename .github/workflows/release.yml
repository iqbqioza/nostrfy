name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: nostrfy-linux-x86_64
          # Native ARM64 runner (GitHub-hosted, public repos).
          - os: ubuntu-24.04-arm
            asset: nostrfy-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The release version is the tag name (e.g. tag v0.1.4 -> 0.1.4):
      # temporarily overwrite the Cargo.toml package version so the built
      # binary reports it via --version / CARGO_PKG_VERSION (and the
      # upgrade command compares against it). Only the first `version =`
      # line inside [package] is replaced.
      - name: Set the release version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^\[package\]/ { in_pkg = 1 }
            in_pkg && /^version = / {
              sub(/version = ".*"/, "version = \"" v "\"")
              in_pkg = 0
            }
            { print }
          ' Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp target/release/nostrfy "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          (cd dist && tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}")
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  freebsd:
    name: Build (nostrfy-freebsd-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Pin a stable release: the action's default tracks FreeBSD
          # -CURRENT, which breaks CI with unrelated upstream churn. The
          # 14.x builder image predates the current pkg repository index
          # (the pkg OS-version check fails), so use the newest stable.
          release: "15.1"
          # IGNORE_OSVERSION: the builder image may lag the current pkg
          # repository index by a patch level (FreeBSD:14:amd64 mismatch);
          # binary compatibility makes ignoring the check safe.
          prepare: |
            env IGNORE_OSVERSION=yes pkg update -f
            env IGNORE_OSVERSION=yes pkg install -y rust
          # The release version is the tag name: same temporary Cargo.toml
          # override as the build job (POSIX awk, no GNU extensions, so it
          # works on FreeBSD's sed-awk).
          run: |
            VERSION="${GITHUB_REF_NAME#v}"
            awk -v v="$VERSION" '
              /^\[package\]/ { in_pkg = 1 }
              in_pkg && /^version = / {
                sub(/version = ".*"/, "version = \"" v "\"")
                in_pkg = 0
              }
              { print }
            ' Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
            cargo build --release
            mkdir -p dist
            cp target/release/nostrfy "dist/nostrfy-freebsd-x86_64"
            chmod +x "dist/nostrfy-freebsd-x86_64"
            (cd dist && tar -czf "nostrfy-freebsd-x86_64.tar.gz" "nostrfy-freebsd-x86_64")
            (cd dist && sha256 -r "nostrfy-freebsd-x86_64" > "nostrfy-freebsd-x86_64.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: nostrfy-freebsd-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release with release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/nostrfy-linux-x86_64 \
            dist/nostrfy-linux-x86_64.tar.gz \
            dist/nostrfy-linux-x86_64.sha256 \
            dist/nostrfy-linux-aarch64 \
            dist/nostrfy-linux-aarch64.tar.gz \
            dist/nostrfy-linux-aarch64.sha256 \
            dist/nostrfy-freebsd-x86_64 \
            dist/nostrfy-freebsd-x86_64.tar.gz \
            dist/nostrfy-freebsd-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "See the commit history for changes in this release." \
            --generate-notes